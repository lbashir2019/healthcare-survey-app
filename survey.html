<!DOCTYPE html>
<html>
<head>
    <title>Healthcare Survey</title>
</head>
<body>
    <h2>User Survey</h2>
    <form method="POST">
        <label>Age:</label>
        <input type="number" name="age" required><br><br>

        <label>Gender:</label>
        <select name="gender" required>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select><br><br>

        <label>Total Income:</label>
        <input type="number" name="income" required><br><br>

        <h3>Expenses</h3>
        <input type="checkbox" name="utilities"> Utilities
        <input type="number" name="utilities_amount" placeholder="Amount"><br><br>

        <input type="checkbox" name="entertainment"> Entertainment
        <input type="number" name="entertainment_amount" placeholder="Amount"><br><br>

        <input type="checkbox" name="school_fees"> School Fees
        <input type="number" name="school_fees_amount" placeholder="Amount"><br><br>

        <input type="checkbox" name="shopping"> Shopping
        <input type="number" name="shopping_amount" placeholder="Amount"><br><br>

        <input type="checkbox" name="healthcare"> Healthcare
        <input type="number" name="healthcare_amount" placeholder="Amount"><br><br>

        <!-- Submit button -->
        <button type="submit">Submit Survey</button>
    </form>
</body>
</html>
